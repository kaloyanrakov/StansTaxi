name: stanstaxi

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stanstaxi/backend:latest
    container_name: stanstaxi-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taxi_booking
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - stanstaxi-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: stanstaxi/frontend:latest
    container_name: stanstaxi-frontend
    ports:
      - "3000:80"
      - "3001:81"
    networks:
      - stanstaxi-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  stanstaxi-network:
    name: stanstaxi-network
    driver: bridge